name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated rather than committed — it is pure
      # Gradle boilerplate that drifts with every Flutter release. `git checkout`
      # puts our own tracked files (lib/, pubspec.yaml, …) back afterwards; the
      # freshly created android/ is untracked, so it survives.
      - name: Scaffold Android project
        run: |
          flutter create --platforms=android \
            --org com.moneyplant --project-name money_plant .
          git checkout -- .
          rm -f test/widget_test.dart

      # App label + the storage permissions the Excel export needs.
      - name: Patch AndroidManifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="money_plant"|android:label="Money Plant"|' "$M"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n\n    <application|' "$M"
          cat "$M"

      - run: flutter pub get

      # Legacy + adaptive + Android 13 themed icons, all from assets/icon/.
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - run: flutter test

      - run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/MoneyPlant-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: money-plant-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
